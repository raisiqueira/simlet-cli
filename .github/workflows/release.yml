name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      # mise verifies these attestations when it installs from GitHub.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/homebrew-formula.sh "$version" > simlet.rb

          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set. Copy the formula from the job summary to raisiqueira/homebrew-tap."
            { echo '```ruby'; cat simlet.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/raisiqueira/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp simlet.rb tap/Formula/simlet.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/simlet.rb
          git commit -m "simlet $version"
          git push
